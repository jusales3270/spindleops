# Serviços de protocolo do SpindleOps (um container por protocolo).
#
# Segurança: cada serviço faz bind em 127.0.0.1 (só o host alcança) e,
# se SPINDLEOPS_SERVICE_TOKEN estiver definido no .env, exige o token
# em toda requisição (o backend Node envia automaticamente).
#
# Subir tudo: docker compose up -d --build

x-service-defaults: &service-defaults
  network_mode: host
  restart: unless-stopped
  environment:
    - SPINDLEOPS_SERVICE_TOKEN=${SPINDLEOPS_SERVICE_TOKEN:-}
    - BIND_HOST=${SERVICE_BIND_HOST:-127.0.0.1}

services:
  focas:
    <<: *service-defaults
    build: ./focas-service
    image: focas-service
    container_name: focas-service

  s7:
    <<: *service-defaults
    build: ./s7-service
    image: s7-service
    container_name: s7-service

  opcua:
    <<: *service-defaults
    build: ./opcua-service
    image: opcua-service
    container_name: opcua-service

  modbus:
    <<: *service-defaults
    build: ./modbus-service
    image: modbus-service
    container_name: modbus-service

  heidenhain:
    <<: *service-defaults
    build: ./heidenhain-service
    image: heidenhain-service
    container_name: heidenhain-service

  mtconnect:
    <<: *service-defaults
    build: ./mtconnect-service
    image: mtconnect-service
    container_name: mtconnect-service

  mitsubishi:
    <<: *service-defaults
    build: ./mitsubishi-service
    image: mitsubishi-service
    container_name: mitsubishi-service

  mazak:
    <<: *service-defaults
    build: ./mazak-service
    image: mazak-service
    container_name: mazak-service
